<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iris Finance Controls</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; }
      .container { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
      .card { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      h1 { margin-top: 0; }
      code { background: #1f2937; padding: 0.2rem 0.4rem; border-radius: 6px; }
      ul { line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Iris Finance Controls</h1>
        <p>A finance controls module for P&L, cost center, and CAPEX governance workflows.</p>
        <ul>
          <li>P&L and variance monitoring</li>
          <li>Cost center budgeting and tracking</li>
          <li>CAPEX project planning and approvals</li>
        </ul>
        <p>API health check: <code>http://localhost:3001/health</code></p>
      </div>
    </div>
  </body>
